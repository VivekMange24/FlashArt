<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QuickDraw AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --yellow:#FFD93D;--blue:#4CC9F0;--pink:#FF6B9D;--green:#06D6A0;--orange:#FF9500;--purple:#7B5EA7;
  --dark:#1a1a2e;--card:#ffffff;--gray:#f0f2f5;--text:#1a1a2e;--subtext:#6b7280;
}
body{font-family:'Nunito',sans-serif;background:var(--gray);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
.header{width:100%;background:var(--dark);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,0.2);}
.logo{font-family:'Fredoka One',cursive;font-size:26px;color:#fff;display:flex;align-items:center;gap:8px;}
.logo span{color:var(--yellow);}
.header-right{display:flex;align-items:center;gap:16px;}
.round-info{color:#aaa;font-size:14px;font-weight:600;}
.score-pill{background:var(--yellow);color:var(--dark);border-radius:99px;padding:5px 18px;font-size:14px;font-weight:800;}
.main{width:100%;max-width:960px;padding:24px 16px;display:flex;flex-direction:column;gap:16px;}
.prompt-card{background:var(--dark);border-radius:20px;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(0,0,0,0.15);}
.prompt-left{display:flex;flex-direction:column;gap:4px;}
.prompt-label{color:#aaa;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.prompt-word{font-family:'Fredoka One',cursive;font-size:42px;color:#fff;letter-spacing:1px;}
.prompt-word .letter{display:inline-block;animation:popIn 0.3s ease forwards;opacity:0;}
@keyframes popIn{from{transform:translateY(8px) scale(0.8);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
.timer-circle{width:72px;height:72px;position:relative;}
.timer-circle svg{transform:rotate(-90deg);}
.timer-circle circle{fill:none;stroke-width:5;stroke-linecap:round;}
.timer-bg{stroke:rgba(255,255,255,0.1);}
.timer-fg{stroke:var(--yellow);stroke-dasharray:188;stroke-dashoffset:0;transition:stroke-dashoffset 0.1s linear,stroke 0.3s;}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:22px;color:#fff;}
.canvas-card{background:#fff;border-radius:20px;box-shadow:0 4px 24px rgba(0,0,0,0.1);overflow:hidden;position:relative;}
.canvas-toolbar{background:var(--dark);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.tool-btn{width:36px;height:36px;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(255,255,255,0.1);color:#fff;transition:all 0.15s;}
.tool-btn:hover{background:rgba(255,255,255,0.2);transform:scale(1.08);}
.tool-btn.active{background:var(--yellow);color:var(--dark);}
.divider{width:1px;height:28px;background:rgba(255,255,255,0.15);margin:0 4px;}
.color-btn{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all 0.15s;}
.color-btn:hover{transform:scale(1.15);}
.color-btn.active{border-color:#fff;transform:scale(1.2);}
.brush-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--yellow);cursor:pointer;}.brush-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--yellow);cursor:pointer;}
.toolbar-right{margin-left:auto;display:flex;gap:8px;}
.clear-btn{background:rgba(255,100,100,0.2);color:#ff6b6b;border:none;border-radius:10px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}
.clear-btn:hover{background:rgba(255,100,100,0.35);}
canvas{display:block;width:100%;height:320px;cursor:crosshair;touch-action:none;background:#fff;}
.overlay{display:none;position:absolute;inset:0;background:rgba(255,255,255,0.96);align-items:center;justify-content:center;flex-direction:column;gap:14px;animation:fadeIn 0.3s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.overlay-icon{font-size:64px;animation:bounceIn 0.5s ease;}
@keyframes bounceIn{0%{transform:scale(0);}70%{transform:scale(1.2);}100%{transform:scale(1);}}
.overlay-title{font-family:'Fredoka One',cursive;font-size:28px;}
.overlay-sub{font-size:15px;color:var(--subtext);text-align:center;max-width:320px;line-height:1.6;white-space:pre-line;}
.overlay-btns{display:flex;gap:10px;margin-top:4px;}
.bottom-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.guess-btn{background:var(--dark);color:#fff;border:none;border-radius:14px;padding:14px 28px;font-size:16px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;display:flex;align-items:center;gap:8px;transition:all 0.2s;box-shadow:0 4px 14px rgba(26,26,46,0.3);}
.guess-btn:hover:not(:disabled){background:#2d2d50;transform:translateY(-2px);}
.guess-btn:disabled{opacity:0.4;cursor:not-allowed;}
.thinking{display:none;align-items:center;gap:6px;font-size:14px;color:var(--subtext);font-weight:700;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--purple);animation:bounce 0.8s infinite;}
.dot:nth-child(2){animation-delay:0.15s;}
.dot:nth-child(3){animation-delay:0.3s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
.result-card{background:#fff;border-radius:16px;padding:16px 20px;box-shadow:0 2px 12px rgba(0,0,0,0.08);display:flex;align-items:flex-start;gap:12px;flex:1;}
.result-label{font-size:12px;color:var(--subtext);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.result-text{font-size:16px;color:var(--text);font-weight:700;line-height:1.5;}
.stats-row{display:flex;gap:12px;}
.stat-card{background:#fff;border-radius:16px;padding:14px 18px;flex:1;box-shadow:0 2px 12px rgba(0,0,0,0.07);display:flex;flex-direction:column;gap:4px;}
.stat-label{font-size:12px;color:var(--subtext);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.stat-value{font-family:'Fredoka One',cursive;font-size:28px;color:var(--dark);}
.stat-sub{font-size:12px;color:var(--subtext);}
.action-btn{border:none;border-radius:12px;padding:12px 22px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;transition:all 0.2s;}
.action-btn.primary{background:var(--dark);color:#fff;}
.action-btn.primary:hover{background:#2d2d50;}
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:999;}
.confetti-piece{position:absolute;width:10px;height:10px;top:-10px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">✏️ Flash<span>Art</span></div>
  <div class="header-right">
    <span class="round-info" id="round-info">Round 1 of 5</span>
    <span class="score-pill" id="score-pill">⭐ 0 pts</span>
  </div>
</div>

<div class="main">
  <div class="prompt-card">
    <div class="prompt-left">
      <div class="prompt-label">🎯 Draw this word</div>
      <div class="prompt-word" id="prompt-word"></div>
    </div>
    <div class="timer-circle">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle class="timer-bg" cx="36" cy="36" r="30"/>
        <circle class="timer-fg" id="timer-fg" cx="36" cy="36" r="30"/>
      </svg>
      <div class="timer-num" id="timer-num">30</div>
    </div>
  </div>

  <div class="canvas-card">
    <div class="canvas-toolbar">
      <button class="tool-btn active" id="pen-btn" onclick="setTool('pen')" title="Pen">✏️</button>
      <button class="tool-btn" id="eraser-btn" onclick="setTool('eraser')" title="Eraser">🧹</button>
      <div class="divider"></div>
      <div style="display:flex;gap:6px;align-items:center;">
        <div class="color-btn active" style="background:#1a1a2e" data-color="#1a1a2e" onclick="setColor(this)"></div>
        <div class="color-btn" style="background:#ef4444" data-color="#ef4444" onclick="setColor(this)"></div>
        <div class="color-btn" style="background:#3b82f6" data-color="#3b82f6" onclick="setColor(this)"></div>
        <div class="color-btn" style="background:#22c55e" data-color="#22c55e" onclick="setColor(this)"></div>
        <div class="color-btn" style="background:#f59e0b" data-color="#f59e0b" onclick="setColor(this)"></div>
        <div class="color-btn" style="background:#a855f7" data-color="#a855f7" onclick="setColor(this)"></div>
        <div class="color-btn" style="background:#ec4899" data-color="#ec4899" onclick="setColor(this)"></div>
      </div>
      <div class="divider"></div>
      <span style="color:#aaa;font-size:12px;font-weight:700;">SIZE</span>
      <input type="range" class="brush-slider" id="brush-size" min="2" max="20" value="3"/>
      <div class="toolbar-right">
        <button class="clear-btn" onclick="clearCanvas()">🗑️ Clear</button>
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-icon" id="overlay-icon">🎉</div>
      <div class="overlay-title" id="overlay-title">Correct!</div>
      <div class="overlay-sub" id="overlay-sub"></div>
      <div class="overlay-btns">
        <button class="action-btn primary" id="next-btn" onclick="nextRound()" style="display:none;">Next Round →</button>
        <button class="action-btn primary" id="play-again-btn" onclick="startGame()" style="display:none;">Play Again 🔄</button>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="guess-btn" id="guess-btn" onclick="submitGuess()" disabled>
      🤖 Ask AI to Guess!
    </button>
    <div class="thinking" id="thinking">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <span>AI is analyzing your drawing…</span>
    </div>
    <div class="result-card">
      <div>
        <div class="result-label">💬 AI's Guess</div>
        <div class="result-text" id="result-text">Start drawing then hit the button!</div>
      </div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">⭐ Score</div>
      <div class="stat-value" id="stat-score">0</div>
      <div class="stat-sub">points earned</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">🔥 Streak</div>
      <div class="stat-value" id="stat-streak" style="color:#ff6b35">0</div>
      <div class="stat-sub">in a row</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">✅ Correct</div>
      <div class="stat-value" id="stat-correct">0</div>
      <div class="stat-sub">out of <span id="stat-total">0</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">⚡ Best Time</div>
      <div class="stat-value" id="stat-best">—</div>
      <div class="stat-sub">seconds left</div>
    </div>
  </div>
</div>

<div class="confetti-wrap" id="confetti-wrap"></div>

<script>
const WORDS = [
  "cat","dog","fish","bird","elephant","butterfly","horse","lion","tiger","monkey",
  "rabbit","snake","penguin","dolphin","owl","frog","crab","shark","bee","duck",
  "pizza","banana","apple","burger","cake","ice cream","donut","sandwich","coffee","watermelon",
  "grapes","strawberry","carrot","cookie","mango","pineapple","mushroom","broccoli","popcorn","taco",
  "car","bicycle","airplane","boat","rocket","bus","train","helicopter","motorcycle","submarine",
  "umbrella","guitar","clock","chair","shoe","hat","pencil","book","lamp","key",
  "phone","camera","bag","crown","diamond","trophy","scissors","ladder","magnet","mirror",
  "ball","bat","tennis racket","football","basketball","skateboard","surfboard","drum","trumpet","paintbrush",
  "tree","sun","cloud","rainbow","mountain","flower","cactus","wave","volcano","star",
  "house","bridge","castle","lighthouse","tent","windmill","barn","igloo","heart","ghost",
  "robot","alien","wizard","sword","shield","compass","hourglass","lantern","anchor","balloon",
  "kite","parachute","boomerang","flame","candle","glasses","watch","ring","bread","camera"
];

let round=1,score=0,streak=0,correct=0,totalRounds=5,bestTime=null;
let timeLeft=30,timerInterval=null;
let drawing=false,currentWord='',hasDrawn=false;
let currentColor='#1a1a2e',currentTool='pen';
let wordQueue=[];

const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

function resizeCanvas(){
  const data=ctx.getImageData(0,0,canvas.width,canvas.height);
  canvas.width=canvas.offsetWidth;
  canvas.height=320;
  ctx.putImageData(data,0,0);
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

function startGame(){
  round=1;score=0;streak=0;correct=0;bestTime=null;
  wordQueue=shuffle(WORDS);
  updateStats();hideOverlay();startRound();
}

function startRound(){
  if(!wordQueue.length) wordQueue=shuffle(WORDS);
  currentWord=wordQueue.pop();
  hasDrawn=false;
  clearCanvas();
  document.getElementById('result-text').textContent='Start drawing then hit the button!';
  document.getElementById('guess-btn').disabled=true;
  document.getElementById('round-info').textContent=`Round ${round} of ${totalRounds}`;
  hideOverlay();
  animateWord(currentWord);
  startTimer();
}

function animateWord(word){
  const el=document.getElementById('prompt-word');
  el.innerHTML='';
  [...word].forEach((ch,i)=>{
    const s=document.createElement('span');
    s.className='letter';
    s.textContent=ch;
    s.style.animationDelay=(i*0.05)+'s';
    el.appendChild(s);
  });
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft=30;updateTimerUI();
  timerInterval=setInterval(()=>{timeLeft--;updateTimerUI();if(timeLeft<=0){clearInterval(timerInterval);timeOut();}},1000);
}

function updateTimerUI(){
  document.getElementById('timer-num').textContent=timeLeft;
  const fg=document.getElementById('timer-fg');
  fg.style.strokeDashoffset=188*(1-timeLeft/30);
  fg.style.stroke=timeLeft>10?'#FFD93D':timeLeft>5?'#ff9500':'#ef4444';
  document.getElementById('timer-num').style.color=timeLeft<=5?'#ef4444':'#fff';
}

function timeOut(){
  if(!hasDrawn){showOverlay('⏰','Time\'s Up!','You didn\'t draw anything this round.',false);return;}
  submitGuess(true);
}

function updateStats(){
  document.getElementById('score-pill').textContent=`⭐ ${score} pts`;
  document.getElementById('stat-score').textContent=score;
  document.getElementById('stat-streak').textContent=streak;
  document.getElementById('stat-correct').textContent=correct;
  document.getElementById('stat-total').textContent=round>1?round-1:0;
  document.getElementById('stat-best').textContent=bestTime!==null?bestTime+'s':'—';
}

function setTool(tool){
  currentTool=tool;
  document.getElementById('pen-btn').classList.toggle('active',tool==='pen');
  document.getElementById('eraser-btn').classList.toggle('active',tool==='eraser');
  canvas.style.cursor=tool==='eraser'?'cell':'crosshair';
}

function setColor(el){
  document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  currentColor=el.dataset.color;
  setTool('pen');
}

document.getElementById('brush-size').addEventListener('input',e=>{window._brushSize=+e.target.value;});
window._brushSize=3;

function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);}

function getPos(e){
  const r=canvas.getBoundingClientRect();
  const sx=canvas.width/r.width,sy=canvas.height/r.height;
  if(e.touches) return{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy};
  return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};
}

canvas.addEventListener('mousedown',e=>{drawing=true;ctx.beginPath();const p=getPos(e);ctx.moveTo(p.x,p.y);hasDrawn=true;document.getElementById('guess-btn').disabled=false;});
canvas.addEventListener('mousemove',e=>{
  if(!drawing)return;const p=getPos(e);
  if(currentTool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(p.x,p.y,window._brushSize*3,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';}
  else{ctx.lineTo(p.x,p.y);ctx.strokeStyle=currentColor;ctx.lineWidth=window._brushSize;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
});
canvas.addEventListener('mouseup',()=>drawing=false);
canvas.addEventListener('mouseleave',()=>drawing=false);
canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;ctx.beginPath();const p=getPos(e);ctx.moveTo(p.x,p.y);hasDrawn=true;document.getElementById('guess-btn').disabled=false;},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=getPos(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle=currentColor;ctx.lineWidth=window._brushSize;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();},{passive:false});
canvas.addEventListener('touchend',()=>drawing=false);

async function submitGuess(){
  if(!hasDrawn)return;
  clearInterval(timerInterval);
  document.getElementById('guess-btn').disabled=true;
  document.getElementById('thinking').style.display='flex';
  document.getElementById('result-text').textContent='';
  const imageData=canvas.toDataURL('image/png').split(',')[1];
  try{
    const res=await fetch('/api/guess',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageData})});
    const data=await res.json();
    document.getElementById('thinking').style.display='none';
    if(data.error){document.getElementById('result-text').textContent='Error: '+data.error;document.getElementById('guess-btn').disabled=false;return;}
    const guess=data.guess;
    document.getElementById('result-text').textContent=guess;
    const isCorrect=guess.toLowerCase().includes(currentWord.toLowerCase());
    const pts=isCorrect?Math.max(10,Math.round(timeLeft*3.33)):0;
    if(isCorrect){score+=pts;streak++;correct++;if(bestTime===null||timeLeft>bestTime)bestTime=timeLeft;spawnConfetti();showOverlay('🎉','Nailed it!',`The AI guessed "${currentWord}"!\n+${pts} points 🎊`,true);}
    else{streak=0;showOverlay('😅','Not quite!',`AI guessed: "${guess}"\nThe word was: "${currentWord}"`,false);}
    updateStats();
    document.getElementById('stat-total').textContent=round;
  }catch(err){
    document.getElementById('thinking').style.display='none';
    document.getElementById('result-text').textContent='Network error — is the server running?';
    document.getElementById('guess-btn').disabled=false;
  }
}

function showOverlay(icon,title,sub,ok){
  document.getElementById('overlay-icon').textContent=icon;
  document.getElementById('overlay-title').textContent=title;
  document.getElementById('overlay-title').style.color=ok?'#06D6A0':'#ef4444';
  const isLast=round>=totalRounds;
  document.getElementById('overlay-sub').textContent=isLast?sub+`\n\n🏆 Game Over! Final Score: ${score} pts`:sub;
  document.getElementById('next-btn').style.display=isLast?'none':'inline-block';
  document.getElementById('play-again-btn').style.display=isLast?'inline-block':'none';
  document.getElementById('overlay').style.display='flex';
}

function hideOverlay(){document.getElementById('overlay').style.display='none';}
function nextRound(){round++;startRound();}

function spawnConfetti(){
  const wrap=document.getElementById('confetti-wrap');
  const colors=['#FFD93D','#4CC9F0','#FF6B9D','#06D6A0','#FF9500','#7B5EA7'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}%;background:${colors[~~(Math.random()*colors.length)]};width:${6+Math.random()*10}px;height:${6+Math.random()*10}px;border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${1+Math.random()*2}s;animation-delay:${Math.random()*.5}s;`;
    wrap.appendChild(el);
    setTimeout(()=>el.remove(),3000);
  }
}

startGame();
</script>
</body>
</html>
